[project]
name = "activedefenceir"
version = "0.1.0"
description = "Active-defence incident response lab: anomaly detection, honeypot deception and AI threat reports"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = "frontend|\\.venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
